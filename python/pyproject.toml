[project]
name = "bowmark-mcp"
version = "2.1.2"
description = "Bowmark MCP for stdio hosts: web scraping and automation for AI agents. Live prices, quotes, bookings, anything behind a login. Starts with a free $10."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Bowmark AI", email = "christopher@bowmark.ai" }]
keywords = ["mcp", "mcp-server", "model-context-protocol", "bowmark", "web-scraping", "web-data", "ai-agent-tools", "ai-agents"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
# The official MCP Python SDK is the only dependency — it brings the
# streamable-HTTP client (httpx) with it. <2 guards against a future major.
dependencies = ["mcp>=1.16,<2"]

[project.urls]
Homepage = "https://bowmark.ai"
Documentation = "https://bowmark.ai/install"
Repository = "https://github.com/bowmark-ai/mcp"

[project.scripts]
bowmark-mcp = "bowmark_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bowmark_mcp"]
