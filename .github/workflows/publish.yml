name: publish

# Publishes the stdio bridges to PyPI (python/) and npm (node/ + node-compat/)
# whenever the monorepo mirror-sync lands a new manifest version.
#
# THREE packages, two registries, and the npm names diverge from the PyPI one on
# purpose:
#
#   python/       → PyPI `bowmark-mcp`   — unchanged, and under PEP 752 this is
#                                          the blessed form. PyPI cannot be
#                                          scoped and has no rename or alias.
#   node/         → npm  `@bowmark/mcp`  — canonical since 2026-08-05.
#   node-compat/  → npm  `bowmark-mcp`   — a forwarder whose bin re-execs the
#                                          scoped package, so every config in
#                                          the wild keeps working. npm cannot be
#                                          unpublished and `npm deprecate` only
#                                          warns, so this is what actually
#                                          preserves compatibility.
#
# Do not "fix" the npm/PyPI asymmetry — `gate:facts-agree` asserts the versions
# match and deliberately does not assert the names do.
#
# This file lives at packages/bowmark-mcp/.github/workflows/publish.yml in
# Metroxe/bowmark (inert there — GitHub only runs repo-root workflows) and
# rides the existing mirror sync (release-bowmark-mcp.yml's
# `cp -R monorepo/packages/bowmark-mcp/. mirror/`) into
# github.com/bowmark-ai/mcp, where it becomes a real, live workflow at
# .github/workflows/publish.yml and fires on the sync's push to main.
#
# Publishing runs HERE, not in the monorepo, on purpose: npm/PyPI Trusted
# Publishing (OIDC) validates against package.json's `repository.url` /
# pyproject.toml's `Repository` URL, and those point at this public mirror
# (the private monorepo would fail that check). Publishing from a public
# repo also auto-generates provenance attestations — impossible from the
# private monorepo regardless of `repository.url`, since npm/PyPI both gate
# provenance on the source repo being public.
#
# Versioning stays manual and lives upstream: bumping pyproject.toml /
# package.json in the monorepo IS the release action; this workflow just
# executes it once the bump reaches here. Each job diffs the manifest
# version against the LIVE registry, so a sync that didn't bump a version
# (or a re-run) is a green no-op — never re-publishes an existing version.
#
# Auth: OIDC Trusted Publishing on both registries, configured to trust
# THIS repo + workflow (pypi.org / npmjs.com → Publishing → GitHub →
# owner bowmark-ai, repo mcp, workflow publish.yml). No token secrets.
# Runs on GitHub-hosted runners — free/unmetered on a public repo, and
# npm's OIDC rejects self-hosted runners regardless.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  pypi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v5

      - name: Decide whether to publish
        id: decide
        run: |
          set -euo pipefail
          LOCAL=$(grep -m1 '^version' pyproject.toml | sed 's/.*"\(.*\)"/\1/')
          LIVE=$(curl -s https://pypi.org/pypi/bowmark-mcp/json | python3 -c 'import json,sys; print(json.load(sys.stdin)["info"]["version"])' 2>/dev/null || echo "none")
          echo "local=$LOCAL live=$LIVE"
          if [ "$LOCAL" = "$LIVE" ]; then
            echo "Version $LOCAL already on PyPI — nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish to PyPI
        if: steps.decide.outputs.publish == 'true'
        run: |
          set -euo pipefail
          command -v uv >/dev/null || curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          rm -rf dist
          uv build
          # No token: uv exchanges the job's GitHub OIDC token with PyPI
          # (trusted publishing, detected automatically in GitHub Actions).
          uv publish

  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Decide whether to publish
        id: decide
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./package.json').name")
          LOCAL=$(node -p "require('./package.json').version")
          LIVE=$(npm view "$NAME" version 2>/dev/null || echo "none")
          echo "name=$NAME local=$LOCAL live=$LIVE"
          if [ "$LOCAL" = "$LIVE" ]; then
            echo "Version $LOCAL already on npm — nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # No lockfile ships in this standalone mirror (the monorepo resolves
      # this package's deps via the pnpm workspace root lockfile instead),
      # so a plain install is the correct move here, not `npm ci`.
      - name: Install
        if: steps.decide.outputs.publish == 'true'
        run: |
          set -euo pipefail
          # Trusted publishing needs npm >= 11.5.1; Node 22 bundles npm 10.
          npm install -g npm
          npm install

      - name: Publish to npm
        if: steps.decide.outputs.publish == 'true'
        run: |
          set -euo pipefail
          # prepublishOnly (package.json) builds via tsc before packing.
          # No token / .npmrc: npm exchanges the job's GitHub OIDC token
          # with the registry (trusted publishing).
          #
          # `--access public` is not decoration for a SCOPED package: npm
          # defaults a new @scope/name to RESTRICTED, and a restricted publish
          # on a free org is refused outright.
          npm publish --access public

  # The `bowmark-mcp` name, kept alive. Separate job rather than a matrix over
  # the two directories: this one has no build step, no devDependencies and its
  # own trusted-publisher configuration on npm, and a matrix would hide the fact
  # that a failure here means the OLD name stopped publishing while the new one
  # kept going — which is the failure nobody would notice.
  npm-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: node-compat
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Decide whether to publish
        id: decide
        run: |
          set -euo pipefail
          LOCAL=$(node -p "require('./package.json').version")
          LIVE=$(npm view bowmark-mcp version 2>/dev/null || echo "none")
          echo "local=$LOCAL live=$LIVE"
          if [ "$LOCAL" = "$LIVE" ]; then
            echo "Version $LOCAL already on npm — nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # The forwarder pins `@bowmark/mcp` to an EXACT version, so publishing it
      # before that version is live on the registry would ship a package that
      # cannot install — and npm cannot be unpublished past 72h. Wait for it
      # rather than racing the sibling job.
      - name: Wait for the canonical package to be live
        if: steps.decide.outputs.publish == 'true'
        run: |
          set -euo pipefail
          WANT=$(node -p "require('./package.json').dependencies['@bowmark/mcp']")
          for attempt in $(seq 1 30); do
            if npm view "@bowmark/mcp@$WANT" version >/dev/null 2>&1; then
              echo "@bowmark/mcp@$WANT is live."
              exit 0
            fi
            echo "attempt $attempt: @bowmark/mcp@$WANT not on the registry yet, waiting 20s"
            sleep 20
          done
          echo "::error::@bowmark/mcp@$WANT never appeared. Publishing the forwarder now would ship an uninstallable package, and npm cannot be unpublished."
          exit 1

      # NOT optional, and not the same thing as the sibling job's install step.
      # There is nothing to install for this package — it has no dependencies to
      # fetch here and no build — but **trusted publishing needs npm >= 11.5.1
      # and Node 22 bundles npm 10**, which does not speak OIDC at all and falls
      # straight through to looking for a token: `npm error code ENEEDAUTH`.
      # Measured 2026-08-06 on this job's first run, where the sibling `npm` job
      # published fine because its install step happened to upgrade npm.
      - name: Upgrade npm for trusted publishing
        if: steps.decide.outputs.publish == 'true'
        run: npm install -g npm

      - name: Publish to npm
        if: steps.decide.outputs.publish == 'true'
        run: |
          set -euo pipefail
          # Unscoped and already public; `--access public` is a no-op here and
          # is passed anyway so the two jobs read identically.
          npm publish --access public
